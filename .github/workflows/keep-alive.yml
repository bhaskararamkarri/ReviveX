name: Backend Keep-Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier instance spindown
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping ReviveX Backend Health Check
        run: |
          echo "Pinging ReviveX backend on Render..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://revivex-nzdp.onrender.com/health)
          echo "Response code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "ReviveX backend is healthy and active."
          else
            echo "Warning: Received HTTP $HTTP_STATUS"
          fi
